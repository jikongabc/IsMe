# Plain-HTTP bootstrap topology. Use docker-compose.https.yml (or an external
# TLS terminator) for every public deployment; production admin cookies are
# Secure and are intentionally unusable over direct HTTP.
services:
  web:
    build: .
    env_file:
      - .env
    environment:
      ISME_DATABASE_PATH: /app/data/isme.db
      NODE_ENV: production
    volumes:
      - isme-data:/app/data
      - isme-uploads:/app/public/uploads
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  isme-data:
  isme-uploads:
