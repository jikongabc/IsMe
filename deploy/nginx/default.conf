upstream isme_web {
  server web:3000;
  keepalive 16;
}

limit_req_zone $binary_remote_addr zone=isme_api:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  client_max_body_size 42m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    limit_req zone=isme_api burst=30 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite client-supplied XFF — app trusts the adjacent hop only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://isme_web;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://isme_web;
  }

  location = /api/health {
    access_log off;
    proxy_pass http://isme_web;
  }
}
