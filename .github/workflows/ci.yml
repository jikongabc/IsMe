name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ADMIN_PASSWORD: ci-test-password-123456
      SESSION_SECRET: ci-test-session-secret-at-least-32-chars
      ISME_DATABASE_PATH: ./data/isme-ci.db
      SITE_URL: http://127.0.0.1:3100
      COGDOC_API_URL: ""
      COGDOC_API_KEY: ""
      E2E_PORT: "3100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keep the runner's bundled npm untouched. Install packageManager into an
      # isolated directory, then make that exact binary authoritative.
      - name: Enable repository npm
        run: |
          npm_spec="$(node -p "require('./package.json').packageManager")"
          case "$npm_spec" in
            npm@*) ;;
            *) echo "Unsupported packageManager: $npm_spec" >&2; exit 1 ;;
          esac
          npm_toolchain="$RUNNER_TEMP/npm-toolchain"
          npm install --prefix "$npm_toolchain" --no-save --ignore-scripts "$npm_spec"
          echo "$npm_toolchain/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Required verification
        run: bash scripts/verify-ci.sh
